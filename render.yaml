# Render — API Medro + worker de PDF + bundle de impressão do laudo.
# Web (apps/web) vai no Vercel (apps/web/vercel.json).
services:
  # ── API Medro (Node/Fastify) ──────────────────────────────────────────────
  - type: web
    name: medro-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @medro/shared build &&
      pnpm --filter @medro/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        sync: false # URL do front no Vercel
      - key: JWT_SECRET
        generateValue: true
      - key: DATAVERSE_TENANT_ID
        sync: false
      - key: DATAVERSE_CLIENT_ID
        sync: false
      - key: DATAVERSE_CLIENT_SECRET
        sync: false
      - key: DATAVERSE_ENV_URL
        value: https://org3c66e333.api.crm2.dynamics.com
      - key: DATAVERSE_RESOURCE
        value: https://org3c66e333.crm2.dynamics.com
      - key: DATAVERSE_API_VERSION
        value: "9.2"
      - key: GRAPH_ENABLED
        value: "true"
      - key: PROTHEUS_ENABLED
        value: "false"
      # Gerador de Laudos
      - key: REPORT_PRINT_URL
        fromService: { type: web, name: medro-report-print, property: hostport }
      - key: PDF_WORKER_URL
        fromService: { type: pserv, name: medro-pdf-worker, property: hostport }
      - key: PDF_WORKER_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # ── Worker de PDF (Puppeteer + Chromium slim) — serviço privado ───────────
  - type: pserv
    name: medro-pdf-worker
    runtime: node
    plan: standard # Chromium precisa de RAM
    region: oregon
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/pdf-worker/src/server.js
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      - key: PDF_WORKER_TOKEN
        fromService: { type: web, name: medro-api, property: env, envVarKey: PDF_WORKER_TOKEN }
      - key: PUPPETEER_LOCAL
        value: "false"

  # ── Bundle de impressão do laudo (estático) ──────────────────────────────
  - type: web
    name: medro-report-print
    runtime: static
    rootDir: apps/report-print
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @medro/report-print build
    staticPublishPath: apps/report-print/dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService: { type: web, name: medro-api, property: hostport }
