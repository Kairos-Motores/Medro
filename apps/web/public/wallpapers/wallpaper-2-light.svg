<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="w2-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f7fa" />
      <stop offset="60%" stop-color="#e7eef6" />
      <stop offset="100%" stop-color="#d6e3f0" />
    </linearGradient>
    <pattern id="w2-light-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#4a7fb0" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="80" cy="80" r="1.5" fill="#4a7fb0" fill-opacity="0.2" />
    </pattern>
    <radialGradient id="w2-light-glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4a7fb0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#w2-light-bg)" />
  <rect width="1920" height="1080" fill="url(#w2-light-grid)" />
  <circle cx="1150" cy="540" r="420" fill="url(#w2-light-glow)" />

  <!-- Anéis de rotor concêntricos sutis -->
  <circle cx="1150" cy="540" r="180" fill="none" stroke="#4a7fb0" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="1150" cy="540" r="290" fill="none" stroke="#4a7fb0" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="1150" cy="540" r="410" fill="none" stroke="#4a7fb0" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="16 10" />
  <circle cx="1150" cy="540" r="540" fill="none" stroke="#4a7fb0" stroke-width="0.6" stroke-opacity="0.08" />
</svg>
