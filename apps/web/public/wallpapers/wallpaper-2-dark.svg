<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="w2-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b30" />
      <stop offset="60%" stop-color="#142a49" />
      <stop offset="100%" stop-color="#0a1424" />
    </linearGradient>
    <pattern id="w2-dark-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2a4e87" stroke-width="0.75" stroke-opacity="0.18" />
      <circle cx="80" cy="80" r="1.5" fill="#355fa4" fill-opacity="0.25" />
    </pattern>
    <radialGradient id="w2-dark-glow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#355fa4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e3b63" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0e1b30" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#w2-dark-bg)" />
  <rect width="1920" height="1080" fill="url(#w2-dark-grid)" />
  <circle cx="1200" cy="540" r="500" fill="url(#w2-dark-glow)" />

  <!-- Anéis técnicos de engenharia em azul marinho vibrante -->
  <circle cx="1200" cy="540" r="190" fill="none" stroke="#355fa4" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8 6" />
  <circle cx="1200" cy="540" r="310" fill="none" stroke="#2a4e87" stroke-width="1" stroke-opacity="0.25" />
  <circle cx="1200" cy="540" r="440" fill="none" stroke="#1e3b63" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="16 10" />
  <circle cx="1200" cy="540" r="580" fill="none" stroke="#2a4e87" stroke-width="0.6" stroke-opacity="0.18" />
</svg>
