<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="w1-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf2f7" />
      <stop offset="45%" stop-color="#e2eaf2" />
      <stop offset="100%" stop-color="#d3dfec" />
    </linearGradient>
    <radialGradient id="w1-light-glow1" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#e4edf7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d3dfec" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="w1-light-glow2" cx="80%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#b6cde3" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c9dcee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#dbe7f3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="w1-light-wave" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#b8cee3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Fundo base -->
  <rect width="1920" height="1080" fill="url(#w1-light-bg)" />
  <rect width="1920" height="1080" fill="url(#w1-light-glow1)" />
  <rect width="1920" height="1080" fill="url(#w1-light-glow2)" />

  <!-- Ondas orgânicas suaves estilo macOS Sonoma/Ventura -->
  <path d="M-100,550 C300,420 600,680 1100,520 C1500,390 1800,480 2050,430 L2050,1200 L-100,1200 Z" fill="url(#w1-light-wave)" />
  <path d="M-100,680 C400,560 800,790 1300,610 C1650,480 1850,560 2050,520 L2050,1200 L-100,1200 Z" fill="#ffffff" fill-opacity="0.35" />
  <path d="M-100,820 C500,710 900,920 1450,740 C1750,640 1920,700 2050,680 L2050,1200 L-100,1200 Z" fill="#b9cee4" fill-opacity="0.25" />
</svg>
